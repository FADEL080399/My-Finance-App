</style></head><body>
<div id="app"><nav id="nav"></nav><main id="main"><div class="ld">Memuat data…</div></main></div>
<div id="toast"></div><div id="mod"></div>
<script>
const SB=window.SB_CONFIG||{url:"",key:""};
const INC=["Gaji","Bonus","Bisnis/Usaha","Investasi","Hadiah","Freelance","Pendapatan lainnya"],
OUT=["Makanan dan Minuman","Transportasi","Belanja","Tagihan","Kesehatan","Pendidikan","Hiburan","Cicilan","Kebutuhan Rumah","Lain-lain"],
COL=["var(--ac)","#0ea5e9","#f59e0b","#8b5cf6","#ef4444","#14b8a6","#ec4899","#84cc16","#f97316","#64748b"];
const PAY=["Tunai","Transfer Bank","Kartu Debit","Kartu Kredit","E-Wallet"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={tx:[],cats:{in:[...INC],out:[...OUT]},set:{name:"Pengguna",cur:"IDR",df:"dd/mm/yyyy",theme:"auto"}};
let page=location.hash.slice(1)||"dash",per="month",H={q:"",t:"",c:"",f:"",to:"",sort:"date",dir:-1,pg:1},rep="month",db=null,docRef=null,ready=false,tmr;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const money=n=>{try{return new Intl.NumberFormat("id-ID",{style:"currency",currency:S.set.cur,maximumFractionDigits:0}).format(n)}catch(e){return n}};
const MN=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
function fd(d){const[y,m,x]=d.split("-");return S.set.df=="yyyy-mm-dd"?d:S.set.df=="dd MMM yyyy"?`${x} ${MN[+m-1]} ${y}`:`${x}/${m}/${y}`}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",2800)}
/* ---- storage: db (server) with localStorage cache ---- */
function lsGet(){try{return JSON.parse(localStorage.getItem("myfinance"))}catch(e){return null}}
function merge(d){if(d&&d.tx){S={tx:d.tx,cats:d.cats||S.cats,set:{...S.set,...(d.set||{})},del:d.del||{},cu:d.cu||0}}}
let cl=null,user=null,syncing=false,dirty=false,syncMsg="";
function persist(){try{localStorage.setItem("myfinance",JSON.stringify(S))}catch(e){}}
function save(){S.cu=Date.now();dirty=true;persist();clearTimeout(tmr);tmr=setTimeout(()=>sync(),800)}
function mergeR(R){S.del=S.del||{};const m={};(R.tx||[]).forEach(x=>m[x.id]=x);S.tx.forEach(x=>{const o=m[x.id];if(!o||(x.u||0)>=(o.u||0))m[x.id]=x});
 const del={...(R.del||{})};Object.entries(S.del).forEach(([k,v])=>del[k]=Math.max(v,del[k]||0));
 S.tx=Object.values(m).filter(x=>!(del[x.id]>(x.u||0)));S.del=del;if((R.cu||0)>(S.cu||0)){S.cats=R.cats||S.cats;S.set={...S.set,...(R.set||{})};S.cu=R.cu}}
async function sync(manual){if(!cl||!user||syncing)return;syncing=true;const d=dirty;dirty=false;
 try{const{data:r,error}=await cl.from("app_state").select("data").eq("user_id",user.id).maybeSingle();if(error)throw error;
  const b=JSON.stringify(S);if(r&&r.data)mergeR(r.data);const ch=JSON.stringify(S)!=b;
  if(d||!r){const{error:e2}=await cl.from("app_state").upsert({user_id:user.id,data:S,updated_at:new Date().toISOString()});if(e2)throw e2}
  persist();syncMsg="Tersinkron "+new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});if(manual)toast("Sinkronisasi selesai");if(ch&&!document.querySelector(".ov"))render()}
 catch(e){dirty=dirty||d;syncMsg="Offline, akan dicoba lagi";if(manual)toast("Gagal sinkron, cek koneksi")}
 syncing=false;if(dirty)setTimeout(()=>sync(),1500)}
function loginPage(){const dots=[0,1,2,3,4,5,6].map(i=>{const a=i*2*Math.PI/7;return`<circle cx="${(28+18*Math.sin(a)).toFixed(1)}" cy="${(28-18*Math.cos(a)).toFixed(1)}" r="${i%2?4:5}" fill="var(--ac)"/>`}).join("");
return`<div class="lg"><svg viewBox="0 0 56 56" width="56" height="56">${dots}</svg><h1>Selamat datang kembali</h1><div class="k">Masuk agar data tersinkron antara aplikasi dan web.</div><label>Email</label><input id="le" type="email" autocomplete="email" placeholder="nama@email.com"><label>Sandi</label><div class="pw"><input id="lp" type="password" autocomplete="current-password" placeholder="Sandi"><button type="button" onclick="tp()" aria-label="Tampilkan sandi">${ic('<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>')}</button></div><button class="p lgb" onclick="auth(false)">Masuk</button><div class="k" style="margin-top:20px">Belum punya akun? <a onclick="auth(true)" style="color:var(--act);cursor:pointer;font-weight:600">Daftar</a></div></div>`}
function tp(){const e=$("#lp");e.type=e.type=="password"?"text":"password"}
async function auth(up){const e=$("#le").value.trim(),p=$("#lp").value;if(!e||p.length<6)return toast("Isi email dan sandi (min. 6 karakter)");
 try{const r=up?await cl.auth.signUp({email:e,password:p}):await cl.auth.signInWithPassword({email:e,password:p});if(r.error)throw r.error;
  if(!r.data.session)return toast("Cek email untuk konfirmasi, lalu tekan Masuk");user=r.data.session.user;dirty=true;await sync();render()}catch(x){toast(x.message||"Gagal masuk")}}
async function logout(){await sync();if(dirty)return toast("Ada data belum tersinkron, coba lagi saat online");await cl.auth.signOut();user=null;S={tx:[],cats:{in:[...INC],out:[...OUT]},set:S.set,del:{},cu:0};persist();render()}
async function init(){merge(lsGet());theme();
 try{const c=window.claude&&await Promise.race([claude.use("db"),new Promise(r=>setTimeout(()=>r(null),4000))]);
  const u=window.claude&&await claude.use("user");
  if(c&&u){db=c;const id=await u.id();docRef=db.collection("data/users/"+id).doc("app");const s=await docRef.get();if(s.exists)merge(s.data());else if(S.tx.length)docRef.set(JSON.parse(JSON.stringify(S)))}}catch(e){}
 if(SB.url&&window.supabase){cl=supabase.createClient(SB.url,SB.key,{auth:{persistSession:true,autoRefreshToken:true}});try{const{data}=await cl.auth.getSession();user=data.session?data.session.user:null}catch(e){}
  if(user){sync();addEventListener("focus",()=>sync());document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync()});setInterval(()=>sync(),30000)}}
 ready=true;theme();render()}
function theme(){const r=document.documentElement;!S.set.theme||S.set.theme=="auto"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",S.set.theme);applyAccent(pendAcc||S.set.accent||DEF)}
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>applyAccent(pendAcc||S.set.accent||DEF));
/* ---- helpers ---- */
const sum=(a,t)=>a.filter(x=>x.type==t).reduce((s,x)=>s+x.amount,0);
function inPeriod(d,p){const n=new Date(),x=new Date(d+"T00:00:00");if(p=="day")return d==today();
 if(p=="week"){const s=new Date(n);s.setDate(n.getDate()-((n.getDay()+6)%7));s.setHours(0,0,0,0);return x>=s}
 if(p=="month")return x.getMonth()==n.getMonth()&&x.getFullYear()==n.getFullYear();return x.getFullYear()==n.getFullYear()}
const PL={day:"Hari ini",week:"Minggu ini",month:"Bulan ini",year:"Tahun ini"};
function tabs(cur,fn){return`<div class="tabs">${Object.keys(PL).map(k=>`<button class="${k==cur?"on":""}" onclick="${fn}('${k}')">${PL[k].split(" ")[0]}</button>`).join("")}</div>`}
function catColor(c,all){return COL[all.indexOf(c)%COL.length]}
function donut(tx){const o=tx.filter(x=>x.type=="out"),by={};o.forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amount);const e=Object.entries(by).sort((a,b)=>b[1]-a[1]),t=e.reduce((s,x)=>s+x[1],0);

/* ---- export / import ---- */
function data(){const ys=[...new Set(S.tx.map(x=>x.date.slice(0,4)))].sort();
 return`<h1>Export & Import</h1><div class="card"><h2>Export Excel (.xlsx)</h2><div class="row"><select id="e_t"><option value="">Semua transaksi</option><option value="in">Hanya pemasukan</option><option value="out">Hanya pengeluaran</option></select><select id="e_y"><option value="">Semua tahun</option>${ys.map(y=>`<option>${y}</option>`).join("")}</select><select id="e_m"><option value="">Semua bulan</option>${MN.map((m,i)=>`<option value="${String(i+1).padStart(2,"0")}">${m}</option>`).join("")}</select><button class="p" onclick="exportX()">Export</button></div><div class="k">Berisi sheet Transaksi dan sheet Ringkasan.</div></div>
 <div class="card"><h2>Import (.xlsx / .csv)</h2><div class="k" style="margin-bottom:8px">Kolom: Tanggal, Jenis (Pemasukan/Pengeluaran), Kategori, Deskripsi, Nominal, Metode. Data tidak valid dan duplikat dilewati.</div><input type="file" accept=".xlsx,.xls,.csv" onchange="importX(this.files[0])"></div>
 <div class="card"><h2>Google Sheets</h2><div class="k">Sinkronisasi langsung ke Google Sheets API tidak tersedia di versi ini. Alternatif: export .xlsx lalu impor ke Google Sheets lewat File ▸ Import, atau sebaliknya unduh sheet sebagai .xlsx/.csv dan impor di sini.</div></div>`}
async function dl(name,data){const C=window.Capacitor;
 try{if(C&&C.isNativePlatform&&C.isNativePlatform()){const b=data instanceof Blob?data:new Blob([data]);
  const b64=await new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(",")[1]);f.onerror=j;f.readAsDataURL(b)});
  const F=C.Plugins.Filesystem,u=await F.writeFile({path:name,data:b64,directory:"CACHE"});
  await C.Plugins.Share.share({title:name,url:u.uri,dialogTitle:"Simpan atau bagikan file"});toast("File siap")}
 else{const a=document.createElement("a");a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=name;a.click();toast("File diunduh")}}
 catch(e){toast("Gagal menyimpan file")}}
function exportX(){if(!window.XLSX)return toast("Library Excel belum termuat");const t=$("#e_t").value,y=$("#e_y").value,m=$("#e_m").value;
 const l=S.tx.filter(x=>(!t||x.type==t)&&(!y||x.date.startsWith(y))&&(!m||x.date.slice(5,7)==m)).sort((a,b)=>a.date.localeCompare(b.date));if(!l.length)return toast("Tidak ada data untuk diexport");
 const wb=XLSX.utils.book_new(),rows=l.map(x=>({Tanggal:x.date,Jenis:x.type=="in"?"Pemasukan":"Pengeluaran",Kategori:x.cat,Deskripsi:x.desc,Nominal:x.amount,Metode:x.method})),ws=XLSX.utils.json_to_sheet(rows);ws["!cols"]=[12,13,22,34,14,18].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws,"Transaksi");
 const i=sum(l,"in"),o=sum(l,"out"),by={};l.filter(x=>x.type=="out").forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amount);
 const sm=[["Ringkasan Keuangan"],["Total pemasukan",i],["Total pengeluaran",o],["Saldo",i-o],[],["Pengeluaran per kategori","Nominal"],...Object.entries(by).sort((a,b)=>b[1]-a[1])],ss=XLSX.utils.aoa_to_sheet(sm);ss["!cols"]=[{wch:28},{wch:16}];XLSX.utils.book_append_sheet(wb,ss,"Ringkasan");
 dl(`myfinance-${y||"semua"}${m?"-"+m:""}.xlsx`,new Blob([XLSX.write(wb,{type:"array",bookType:"xlsx"})]))}
function pd(v){if(typeof v=="number"&&v>20000){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}
 v=String(v||"").trim();let m;if(m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;if(m=v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/))return`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;return null}
async function importX(f){if(!f)return;try{const wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:false}),r=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
 const key=x=>[x.date,x.type,x.cat,x.desc,x.amount].join("|"),seen=new Set(S.tx.map(key));let ok=0,bad=0,dup=0;
 r.forEach(w=>{const j=String(w.Jenis||"").toLowerCase(),type=j.startsWith("pemasukan")||j=="in"?"in":j.startsWith("pengeluaran")||j=="out"?"out":null,date=pd(w.Tanggal),a=+String(w.Nominal).replace(/[^\d.\-]/g,"");
  if(!type||!date||!(a>0)||!String(w.Kategori||"").trim()){bad++;return}
  const x={u:Date.now(),id:uid(),type,date,amount:a,cat:String(w.Kategori).trim(),desc:String(w.Deskripsi||"").trim(),method:String(w.Metode||"").trim()};
  if(seen.has(key(x))){dup++;return}seen.add(key(x));if(!S.cats[type].includes(x.cat))S.cats[type].push(x.cat);S.tx.push(x);ok++});
 save();render();toast(`Import: ${ok} masuk, ${bad} tidak valid, ${dup} duplikat`)}catch(e){toast("File tidak dapat dibaca")}}
/* ---- settings ---- */
function settings(){return`<h1>Pengaturan</h1>${appearance()}<div class="card glass"><label class="k">Nama pengguna</label><br><input value="${esc(S.set.name)}" onchange="S.set.name=this.value.trim()||'Pengguna';save();toast('Tersimpan')">
 <div class="row" style="margin-top:12px"><div><label class="k">Mata uang</label><br><select onchange="S.set.cur=this.value;save();render()">${["IDR","USD","EUR","SGD","MYR","JPY"].map(c=>`<option ${c==S.set.cur?"selected":""}>${c}</option>`).join("")}</select></div>
 <div><label class="k">Format tanggal</label><br><select onchange="S.set.df=this.value;save();render()">${["dd/mm/yyyy","yyyy-mm-dd","dd MMM yyyy"].map(c=>`<option ${c==S.set.df?"selected":""}>${c}</option>`).join("")}</select></div>
 </div></div>
 <div class="card glass"><h2>Kategori</h2><div class="row"><button onclick="cats('in')">Kategori pemasukan</button><button onclick="cats('out')">Kategori pengeluaran</button></div></div>
 ${SB.url?`<div class="card glass"><h2>Akun & sinkronisasi</h2><div class="k">${esc(user?user.email:"")} · ${syncMsg||"Belum sinkron"}</div><div class="row" style="margin-top:10px"><button onclick="sync(true)">Sinkronkan sekarang</button><button class="d" onclick="logout()">Keluar</button></div></div>`:""}<div class="card glass"><h2>Backup & restore</h2><div class="row"><button onclick="dl('myfinance-backup-'+today()+'.json',JSON.stringify(S))">Unduh backup (.json)</button><input type="file" accept=".json" onchange="restore(this.files[0])"></div><div class="k">Data tersimpan di dalam aplikasi pada perangkat ini. Buat backup secara berkala.</div></div>`}
async function restore(f){if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.tx))throw 0;merge(d);save();theme();render();toast("Data dipulihkan")}catch(e){toast("File backup tidak valid")}}
init();
</script></body></html>
